<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ゆき — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Nunito:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0a14; --card: rgba(30,16,46,0.9);
      --pink: #ff69b4; --lav: #bf80ff; --cyan: #00e5ff;
      --text: #f0d6f5; --muted: #a07ab0;
      --glow: 0 0 12px rgba(255,105,180,0.5);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:40px 20px; }
    .container { max-width:900px; margin:0 auto; }
    h1 { font-family:'Zen Maru Gothic',sans-serif; font-size:1.6rem; color:var(--pink); text-shadow:var(--glow); margin-bottom:8px; }
    .subtitle { color:var(--muted); font-size:.85rem; margin-bottom:32px; }

    /* login */
    #login { text-align:center; margin-top:20vh; }
    #login h2 { font-family:'Zen Maru Gothic',sans-serif; color:var(--pink); margin-bottom:20px; font-size:1.4rem; }
    #login input {
      background:rgba(255,255,255,.05); border:1px solid rgba(255,105,180,.4);
      border-radius:6px; padding:12px 18px; color:var(--text); font-size:1rem;
      width:280px; outline:none; margin-bottom:12px; display:block; margin:0 auto 12px;
    }
    #login button {
      background:linear-gradient(135deg,var(--pink),var(--lav));
      border:none; border-radius:6px; padding:12px 32px;
      color:#fff; font-size:.95rem; font-weight:900; cursor:pointer;
      transition:transform .2s;
    }
    #login button:hover { transform:scale(1.04); }
    .error-msg { color:#ff6b6b; font-size:.82rem; margin-top:10px; }

    /* tabs */
    #app { display:none; }
    .tabs { display:flex; gap:12px; margin-bottom:28px; }
    .tab {
      padding:8px 22px; border-radius:6px; border:1px solid rgba(255,105,180,.3);
      background:transparent; color:var(--muted); font-size:.85rem; font-weight:700;
      cursor:pointer; transition:all .2s;
    }
    .tab.active { background:rgba(255,105,180,.15); border-color:var(--pink); color:var(--pink); text-shadow:var(--glow); }

    /* cards */
    .card {
      background:var(--card); border:1px solid rgba(255,105,180,.2);
      border-radius:8px; padding:18px 20px; margin-bottom:14px;
      position:relative;
    }
    .card .meta { font-size:.72rem; color:var(--muted); margin-bottom:8px; }
    .card .msg { font-size:.9rem; line-height:1.6; color:var(--text); }
    .card .del-btn {
      position:absolute; top:14px; right:16px;
      background:rgba(255,80,80,.15); border:1px solid rgba(255,80,80,.3);
      border-radius:4px; padding:3px 10px; color:#ff6b6b;
      font-size:.72rem; font-weight:700; cursor:pointer; transition:all .2s;
    }
    .card .del-btn:hover { background:rgba(255,80,80,.3); }
    .empty { color:var(--muted); font-size:.9rem; text-align:center; padding:40px 0; }

    /* drawing cards */
    .drawing-card { background:var(--card); border:1px solid rgba(191,128,255,.2); border-radius:8px; padding:16px; margin-bottom:14px; }
    .drawing-card img { width:100%; max-width:400px; border-radius:6px; border:1px solid rgba(191,128,255,.3); display:block; }
    .drawing-card .draw-msg { font-size:.85rem; color:var(--muted); margin-top:8px; font-style:italic; }
    .drawing-card .meta { font-size:.72rem; color:var(--muted); margin-bottom:10px; }
    .drawing-card .del-btn {
      margin-top:10px; background:rgba(255,80,80,.15); border:1px solid rgba(255,80,80,.3);
      border-radius:4px; padding:4px 12px; color:#ff6b6b;
      font-size:.72rem; font-weight:700; cursor:pointer;
    }

    .count-badge {
      background:rgba(255,105,180,.15); border:1px solid rgba(255,105,180,.3);
      border-radius:20px; padding:2px 10px; font-size:.72rem; color:var(--pink);
      margin-left:8px;
    }
    .logout { float:right; background:transparent; border:1px solid rgba(255,105,180,.3); border-radius:6px; padding:6px 16px; color:var(--muted); font-size:.78rem; cursor:pointer; }
    .logout:hover { color:var(--pink); border-color:var(--pink); }
  </style>
</head>
<body>
<div class="container">

  <!-- LOGIN -->
  <div id="login">
    <h2>🔐 ゆき Admin</h2>
    <input type="password" id="pw-input" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button onclick="doLogin()">Enter →</button>
    <div class="error-msg" id="login-error"></div>
  </div>

  <!-- APP -->
  <div id="app">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
      <h1>// 管理画面 Admin Panel</h1>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
    <div class="subtitle">ゆき's secret dashboard 🌸</div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('messages')">
        💬 Messages <span class="count-badge" id="msg-count">0</span>
      </button>
      <button class="tab" onclick="showTab('drawings')">
        🎨 Drawings <span class="count-badge" id="draw-count">0</span>
      </button>
    </div>

    <div id="tab-messages">
      <div id="messages-list"><div class="empty">Loading...</div></div>
    </div>
    <div id="tab-drawings" style="display:none;">
      <div id="drawings-list"><div class="empty">Loading...</div></div>
    </div>
  </div>

</div>
<script>
  let PASSWORD = '';

  function doLogin() {
    const pw = document.getElementById('pw-input').value;
    if (!pw) return;
    PASSWORD = pw;
    loadAll();
  }

  function logout() {
    PASSWORD = '';
    document.getElementById('app').style.display = 'none';
    document.getElementById('login').style.display = 'block';
    document.getElementById('pw-input').value = '';
  }

  async function loadAll() {
    const [mRes, dRes] = await Promise.all([
      fetch('/api/messages', { headers: { 'x-admin-password': PASSWORD } }),
      fetch('/api/drawings', { headers: { 'x-admin-password': PASSWORD } }),
    ]);

    if (mRes.status === 401) {
      document.getElementById('login-error').textContent = '❌ Wrong password';
      return;
    }

    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    const mData = await mRes.json();
    const dData = await dRes.json();

    renderMessages(mData.messages ?? []);
    renderDrawings(dData.drawings ?? []);
  }

  function renderMessages(messages) {
    document.getElementById('msg-count').textContent = messages.length;
    const el = document.getElementById('messages-list');
    if (!messages.length) { el.innerHTML = '<div class="empty">😴 No messages yet...</div>'; return; }
    el.innerHTML = messages.map(m => `
      <div class="card" id="msg-${m.id}">
        <div class="meta">#${m.id} · ${new Date(m.created_at).toLocaleString()}</div>
        <div class="msg">${escHtml(m.message)}</div>
        <button class="del-btn" onclick="deleteMsg(${m.id})">Delete</button>
      </div>`).join('');
  }

  function renderDrawings(drawings) {
    document.getElementById('draw-count').textContent = drawings.length;
    const el = document.getElementById('drawings-list');
    if (!drawings.length) { el.innerHTML = '<div class="empty">🎨 No drawings yet...</div>'; return; }
    el.innerHTML = drawings.map(d => `
      <div class="drawing-card" id="draw-${d.id}">
        <div class="meta">#${d.id} · ${new Date(d.created_at).toLocaleString()}</div>
        <img src="${d.image_data}" alt="Drawing"/>
        ${d.message ? `<div class="draw-msg">"${escHtml(d.message)}"</div>` : ''}
        <button class="del-btn" onclick="deleteDraw(${d.id})">Delete</button>
      </div>`).join('');
  }

  async function deleteMsg(id) {
    await fetch('/api/messages', { method:'DELETE', headers:{'x-admin-password':PASSWORD,'Content-Type':'application/json'}, body:JSON.stringify({id}) });
    document.getElementById(`msg-${id}`)?.remove();
    document.getElementById('msg-count').textContent = parseInt(document.getElementById('msg-count').textContent) - 1;
  }

  async function deleteDraw(id) {
    await fetch('/api/drawings', { method:'DELETE', headers:{'x-admin-password':PASSWORD,'Content-Type':'application/json'}, body:JSON.stringify({id}) });
    document.getElementById(`draw-${id}`)?.remove();
    document.getElementById('draw-count').textContent = parseInt(document.getElementById('draw-count').textContent) - 1;
  }

  function showTab(tab) {
    document.getElementById('tab-messages').style.display = tab === 'messages' ? 'block' : 'none';
    document.getElementById('tab-drawings').style.display = tab === 'drawings' ? 'block' : 'none';
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='messages')||(i===1&&tab==='drawings')));
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
