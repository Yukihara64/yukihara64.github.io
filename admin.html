<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SCHALE Main Terminal — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@700;900&family=Nunito:wght@700;900&display=swap" rel="stylesheet"/>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="admin-container">

  <!-- LOGIN -->
  <div id="login">
    <div class="shittim-chest-emblem mb-3">
      <svg width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: var(--cyan); filter: drop-shadow(0 0 5px var(--cyan));">
        <path d="M50 5 L50 95 M5 50 L95 50" stroke="currentColor" stroke-width="4"/>
        <circle cx="50" cy="50" r="25" stroke="currentColor" stroke-width="3" stroke-dasharray="6 3"/>
        <polygon points="50,15 62,40 85,50 62,60 50,85 38,60 15,50 38,40" fill="currentColor"/>
      </svg>
    </div>
    <h2>🔐 ACCESS PASSCODE REQUIRED</h2>
    <div class="console-boot-text mb-4">
      [SYSTEM: SHITTIM CHEST OS v3.2]<br>
      [STATUS: LINKED TO GSC DATABASE]<br>
      [AWAITING SENSEI AUTHORIZATION CODE]
    </div>
    <input type="password" id="pw-input" placeholder="ENTER SENSEI PASSKEY" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button onclick="doLogin()">AUTHORIZE →</button>
    <div class="error-msg" id="login-error"></div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <h1 class="m-0">// SCHALE SYSTEM CONSOLE</h1>
      <button class="btn btn-outline-pink btn-sm logout" onclick="logout()">Logout</button>
    </div>
    <div class="subtitle">Federal Investigation Club Support System — Shittim Chest Terminal</div>

    <ul class="nav nav-pills gap-2 mb-4 mt-4" id="adminTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active tab-pill" onclick="showTab('messages')" type="button">
          💬 Messages <span class="badge rounded-pill bg-pink-glow ms-2" id="msg-count">0</span>
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link tab-pill" onclick="showTab('drawings')" type="button">
          🎨 Drawings <span class="badge rounded-pill bg-lav-glow ms-2" id="draw-count">0</span>
        </button>
      </li>
    </ul>

    <div id="tab-messages" class="tab-content-area">
      <div id="messages-list" class="row g-3"><div class="col-12 empty">Loading...</div></div>
    </div>
    <div id="tab-drawings" class="tab-content-area" style="display:none;">
      <div id="drawings-list" class="row g-3"><div class="col-12 empty">Loading...</div></div>
    </div>
  </div>

</div>
<script type="module" src="/src/admin.ts"></script>
</body>
</html>
