<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ゆき — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Nunito:wght@700;900&display=swap" rel="stylesheet"/>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-container">

  <!-- LOGIN -->
  <div id="login">
    <h2>🔐 ゆき Admin</h2>
    <input type="password" id="pw-input" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button onclick="doLogin()">Enter →</button>
    <div class="error-msg" id="login-error"></div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <h1 class="m-0">// 管理画面 Admin Panel</h1>
      <button class="btn btn-outline-pink btn-sm logout" onclick="logout()">Logout</button>
    </div>
    <div class="subtitle">ゆき's secret dashboard 🌸</div>

    <ul class="nav nav-pills gap-2 mb-4 mt-4" id="adminTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active tab-pill" onclick="showTab('messages')" type="button">
          💬 Messages <span class="badge rounded-pill bg-pink-glow ms-2" id="msg-count">0</span>
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link tab-pill" onclick="showTab('drawings')" type="button">
          🎨 Drawings <span class="badge rounded-pill bg-lav-glow ms-2" id="draw-count">0</span>
        </button>
      </li>
    </ul>

    <div id="tab-messages" class="tab-content-area">
      <div id="messages-list" class="row g-3"><div class="col-12 empty">Loading...</div></div>
    </div>
    <div id="tab-drawings" class="tab-content-area" style="display:none;">
      <div id="drawings-list" class="row g-3"><div class="col-12 empty">Loading...</div></div>
    </div>
  </div>

</div>
<script>
  let PASSWORD = '';

  function doLogin() {
    const pw = document.getElementById('pw-input').value;
    if (!pw) return;
    PASSWORD = pw;
    loadAll();
  }

  function logout() {
    PASSWORD = '';
    document.getElementById('app').style.display = 'none';
    document.getElementById('login').style.display = 'block';
    document.getElementById('pw-input').value = '';
  }

  async function loadAll() {
    const [mRes, dRes] = await Promise.all([
      fetch('/api/messages', { headers: { 'x-admin-password': PASSWORD } }),
      fetch('/api/drawings', { headers: { 'x-admin-password': PASSWORD } }),
    ]);

    if (mRes.status === 401) {
      document.getElementById('login-error').textContent = '❌ Wrong password';
      return;
    }

    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    const mData = await mRes.json();
    const dData = await dRes.json();

    renderMessages(mData.messages ?? []);
    renderDrawings(dData.drawings ?? []);
  }

  function renderMessages(messages) {
    document.getElementById('msg-count').textContent = messages.length;
    const el = document.getElementById('messages-list');
    if (!messages.length) { el.innerHTML = '<div class="col-12 empty">😴 No messages yet...</div>'; return; }
    el.innerHTML = messages.map(m => `
      <div class="col-12" id="msg-${m.id}">
        <div class="card admin-card h-100">
          <div class="card-body">
            <div class="meta mb-2 text-muted small">#${m.id} · ${new Date(m.created_at).toLocaleString()}</div>
            <div class="msg text-light">${escHtml(m.message)}</div>
            <button class="btn btn-danger btn-sm del-btn position-absolute top-0 end-0 m-3" onclick="deleteMsg(${m.id})">Delete</button>
          </div>
        </div>
      </div>`).join('');
  }

  function renderDrawings(drawings) {
    document.getElementById('draw-count').textContent = drawings.length;
    const el = document.getElementById('drawings-list');
    if (!drawings.length) { el.innerHTML = '<div class="col-12 empty">🎨 No drawings yet...</div>'; return; }
    el.innerHTML = drawings.map(d => `
      <div class="col-12 col-md-6 col-lg-4" id="draw-${d.id}">
        <div class="card admin-card h-100">
          <div class="card-body d-flex flex-column">
            <div class="meta mb-2 text-muted small">#${d.id} · ${new Date(d.created_at).toLocaleString()}</div>
            <img src="${d.image_data}" alt="Drawing" class="img-fluid rounded border border-secondary border-opacity-25 mb-3"/>
            ${d.message ? `<div class="draw-msg text-muted small flex-grow-1">"${escHtml(d.message)}"</div>` : '<div class="flex-grow-1"></div>'}
            <button class="btn btn-danger btn-sm del-btn mt-3 align-self-start" onclick="deleteDraw(${d.id})">Delete</button>
          </div>
        </div>
      </div>`).join('');
  }

  async function deleteMsg(id) {
    await fetch('/api/messages', { method:'DELETE', headers:{'x-admin-password':PASSWORD,'Content-Type':'application/json'}, body:JSON.stringify({id}) });
    document.getElementById(`msg-${id}`)?.remove();
    document.getElementById('msg-count').textContent = parseInt(document.getElementById('msg-count').textContent) - 1;
  }

  async function deleteDraw(id) {
    await fetch('/api/drawings', { method:'DELETE', headers:{'x-admin-password':PASSWORD,'Content-Type':'application/json'}, body:JSON.stringify({id}) });
    document.getElementById(`draw-${id}`)?.remove();
    document.getElementById('draw-count').textContent = parseInt(document.getElementById('draw-count').textContent) - 1;
  }

  function showTab(tab) {
    document.getElementById('tab-messages').style.display = tab === 'messages' ? 'block' : 'none';
    document.getElementById('tab-drawings').style.display = tab === 'drawings' ? 'block' : 'none';
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='messages')||(i===1&&tab==='drawings')));
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
